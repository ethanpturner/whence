# Edges that exist but cannot be established. The correct output is `unverifiable`.

unresolvable:
  - source: "<referring model>"
    target: "<declared base>"
    relation: derives-from
    provenance: unresolvable
    verdict: unverifiable
    why: >-
      The target cannot be pinned, fetched, or compared, so no stronger provenance class is
      reachable. This remains true permanently rather than pending better credentials: unlike the
      401 in `prose-only-base`, a deleted repository does not become resolvable to an
      authenticated caller.

compositions:
  - aggregate: unknown
    scope: "<declared base>"
    why: >-
      Resolution was attempted and was inconclusive. Distinct from the depth-ceiling `incomplete`
      in `declared-base`, and distinct again from a transient failure, which produces no
      composition and no verdict at all (DEC-014).
