# Conclusions and edges that must not appear.

absent:
  - source: bartowski/AvelonLabs_OpenClaude-1.7B-Merged-GGUF
    target: AvelonLabs/OpenClaude-1.7B-Merged
    relation: quantized-from
    verdict_if_emitted: contradicted
    why: >-
      The likeliest failure. An absent base is not a refuted derivation: the quantization may well
      have happened and the source was removed afterwards. Nothing about the namespace's present
      state bears on whether the derivation occurred.

  - source: bartowski/AvelonLabs_OpenClaude-1.7B-Merged-GGUF
    target: AvelonLabs/OpenClaude-1.7B-Merged
    relation: derives-from
    why: >-
      Flattening. The registry declares `quantized` (DEC-015), and quantized lineage is where
      weight-level comparison performs worst -- the qualifier tells phase two where to distrust
      itself.

negative_assertions:
  - claim: "AvelonLabs/OpenClaude-1.7B-Merged does not exist"
    why: >-
      The registry answered 401, not 404. Unauthenticated, that does not distinguish absence from
      denial. What IS established is that no owner holds the namespace -- a different and more
      actionable fact.

  - claim: "the reference is merely a dead end"
    why: >-
      That is `withdrawn-base`, whose declared base returns the identical status AND the identical
      body. The difference is entirely in the namespace lookups, and treating the two alike loses
      the hijack exposure.

omissions:
  - omitted: "the edge to AvelonLabs/OpenClaude-1.7B-Merged"
    why: >-
      Dropping unreachable nodes is the natural implementation and erases the finding. The exposure
      is visible only if the dangling reference survives into the output.
  - omitted: "whence:namespace-state and whence:risk"
    why: >-
      Without them the BOM records a missing dependency rather than a re-registrable one, which is
      the difference between an inconvenience and a supply-chain exposure.
