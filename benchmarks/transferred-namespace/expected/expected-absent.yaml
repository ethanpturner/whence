# Conclusions and edges that must not appear.

absent:
  - source: Comfy-Org/stable-diffusion-v1-5-archive
    target: stable-diffusion-v1-5/stable-diffusion-v1-5
    relation: derives-from
    without: declared_as
    why: >-
      **The core failure.** Following the redirect and recording only the resolved target asserts
      that this model derives from an artifact its author never named, published by an
      organization that did not exist when the declaration was made. The redirect is real and
      following it is permitted; discarding what was declared is not (DEC-011, DEC-017).

  - source: Comfy-Org/stable-diffusion-v1-5-archive
    target: stable-diffusion-v1-5/stable-diffusion-v1-5
    relation: derives-from
    verdict_if_emitted: verified
    why: >-
      A registry redirect establishes where a name currently points. It establishes nothing about
      whether the derivation occurred, and it is the weakest possible ground for `verified`, since
      the redirect is precisely what makes the reference ambiguous.

properties_absent:
  - node: runwayml/stable-diffusion-v1-5
    property: "whence:risk = reregistrable-reference"
    why: >-
      The `runwayml` organization still exists. The name is held, not free, so nobody else can
      register it. This is the distinction from `deleted-namespace`, and applying that scenario's
      flag here would be wrong in the same way `withdrawn-base` would be.

negative_assertions:
  - claim: "runwayml/stable-diffusion-v1-5 does not exist"
    why: >-
      It resolves. It resolves somewhere else, which is a different and more dangerous fact.

  - claim: "the reference is unchanged / no action needed"
    why: >-
      A consumer pinning this base by name fetches content from an organization the original
      publisher does not control. The recorded interaction shows a file request under the old path
      being served from the new namespace with no error. Silence here is the failure mode with
      real consequences.
