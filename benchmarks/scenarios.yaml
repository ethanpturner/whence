# The scenario registry. The evaluation harness reads scenarios from this file and never
# discovers them by scanning directories. A registry makes the benchmark set a stated fact
# rather than a fact about the filesystem.
#
# status: planned | recorded | unobserved | live
#   planned    - authored, no recording captured yet
#   recorded   - capture exists and replays offline
#   unobserved - authored, and the case was searched for and not found on this registry. Retained
#                deliberately: the behaviour it grades is correct wherever the case occurs, and a
#                registry's present behaviour is a policy rather than a guarantee. The scenario's
#                own document must state the search and its result.
#   live       - requires network; excluded from the default run

version: 0.1
scenarios:
  - slug: declared-base
    name: Declared base, two hops
    path: benchmarks/declared-base
    status: recorded
    category: lineage-resolution
    # The simplest true positive, and it still yields no `verified` edge: every claim is a bare
    # name in card metadata with no revision. Also covers a gated first hop and a registry
    # redirect on the second.

  - slug: deleted-namespace
    name: Declared base whose namespace is gone
    path: benchmarks/deleted-namespace
    status: recorded
    category: dangling-reference
    # Found 2026-09-03 by a 45,000-model sweep: AvelonLabs holds no organization and no user, so
    # the name is free. The premise it was authored on was wrong -- the base returns 401, not 404,
    # with a body identical to withdrawn-base's. Only the namespace lookups separate a dead end
    # from a hijack opportunity, which makes the extra request load-bearing rather than tidy.

  - slug: transferred-namespace
    name: Declared base redirects across an ownership boundary
    path: benchmarks/transferred-namespace
    status: recorded
    category: dangling-reference
    # runwayml/stable-diffusion-v1-5 -> stable-diffusion-v1-5/stable-diffusion-v1-5. The reference
    # does not break; it resolves into a namespace controlled by a different party, and content
    # fetches follow it silently. The referring model has 13.7M downloads. Source of DEC-017.

  - slug: transient-failure
    name: Throttled resolution produces no verdict
    path: benchmarks/transient-failure
    status: recorded
    category: response-classification
    # Same target as declared-base; only the network conditions differ. Composed from authentic
    # captures -- see its scenario.md. The near-miss it forbids is emitting the edge with
    # verdict `unverifiable`, which is invisible downstream against a genuine abstention.

  - slug: withdrawn-base
    name: Base withdrawn, namespace still held
    path: benchmarks/withdrawn-base
    status: recorded
    category: dangling-reference
    # The counterpart to deleted-namespace: unreachable base, but the owning namespace resolves,
    # so the reference is a dead end and NOT re-registrable. Also carries the misleading-401-body
    # trap and the quantized-from relation.

  - slug: prose-only-base
    name: Base named only in prose, unresolvable
    path: benchmarks/prose-only-base
    status: recorded
    category: abstention
    # The resolution boundary. The declared base is unqualified prose, the obvious qualification
    # answers 401, and three plausible shortcuts to a confident answer are all wrong. The
    # negative set carries more weight here than the positive one.

  - slug: merge-lineage
    name: A merge naming six parents in ten declarations
    path: benchmarks/merge-lineage
    status: recorded
    category: lineage-resolution
    measures: >-
      a wide graph: ten declarations naming six parents, four of them adapters, and the node-count
      ceiling DEC-024 added for exactly this shape

  - slug: structural-compatible
    name: A declared base whose transformer body is compatible
    path: benchmarks/structural-compatible
    status: recorded
    category: structural
    # Phase two's first increment. The verdict stays `unverifiable` even though the check passed:
    # every fine-tune of this base has this exact body, so agreement narrows the field to "one of
    # many" rather than "this one". expected-absent forbids `verified` for that reason.

  - slug: quantized-republication
    name: A requantization of a quantization, with the chain broken in the middle
    path: benchmarks/quantized-republication
    status: recorded
    category: abstention
    # GGUF over EXL2 over a distillation, across three namespaces. The hardest case any
    # weight-level method will face (DEC-005): every step is lossy, so nothing upstream can ever be
    # matched. The middle node declares no base at all, and its repository name spells out the link
    # it does not declare -- the strongest invention trap in the corpus, because the guess is
    # almost certainly right. Also pins the copied-card limitation (DEC-028).

  - slug: no-lineage
    name: A model with no upstream
    path: benchmarks/no-lineage
    status: recorded
    category: abstention
    # The negative case: correct output asserts nothing about ancestry while still recording the
    # corpora and library the card does declare. "No ancestor" and "nothing known" are different
    # statements and the graph has to be able to make the first one. The card's derivation verbs
    # all describe descendants, which is the trap.
