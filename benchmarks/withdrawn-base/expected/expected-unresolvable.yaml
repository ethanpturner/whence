# Corrected 2026-09-03 after the first resolver run. This file previously restated the base edge
# with `provenance: unresolvable`, contradicting expected-graph.yaml, which gives the same edge
# `asserted-by-card`. Classified as a truth-set defect and resolved by DEC-018: provenance records
# how the CLAIM was found, and the card plainly asserts this base. The target's unreachability is a
# property of the node, not of how the claim was made.
#
# `unresolvable` is reserved for a reference that could not be constructed at all -- see
# prose-only-base, where the declared name carries no namespace.

unresolvable:
  - subject: "the derivation MaziyarPanahi/WizardLM-2-7B-GGUF quantized-from microsoft/WizardLM-2-7B"
    # The edge this row is about, named structurally so the scorer checks it rather than
    # parsing the sentence above. `subject` stays prose because it says what is open far
    # better than a triple can.
    edge: { source: MaziyarPanahi/WizardLM-2-7B-GGUF, relation: quantized-from, target: microsoft/WizardLM-2-7B }
    why: >-
      Access to the target is denied, so it cannot be pinned or compared and no stronger verdict
      than `unverifiable` is reachable. Unlike deleted-namespace this could resolve for a caller
      holding suitable credentials; the tool records what it could establish unauthenticated and
      does not speculate about what a different caller would see.
    still_established: >-
      That the card asserts the derivation, that the reference is well-formed, and that the owning
      namespace is held rather than free -- so the reference is a dead end and not a hijack
      opportunity.

compositions:
  - aggregate: unknown
    scope: microsoft/WizardLM-2-7B
    why: "Resolution attempted, inconclusive (DEC-014 inconclusive class)."
